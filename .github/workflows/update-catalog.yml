name: Mise à jour du catalogue

on:
  schedule:
    - cron: "17 4 * * *"   # chaque jour vers 5 h (heure de Paris)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main
  push:
    paths:
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les films et les jaquettes
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_catalog.py
      - name: Publier si le catalogue a changé
        run: |
          git config user.name "streamly-bot"
          git config user.email "streamly-bot@users.noreply.github.com"
          git add catalog.json catalog.js
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Catalogue mis à jour ($(date -u +%Y-%m-%d))"
            git push
          fi
