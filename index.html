<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STREAMLY — Films, séries et TV en illimité</title>
<meta name="description" content="Les chefs-d'œuvre du cinéma, des films d'animation et la TV en direct. 7 jours offerts, puis 3,99 € par mois. 100 % légal, sans publicité.">
<meta name="theme-color" content="#09090d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@600;800&family=Creepster&family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;900&family=Playfair+Display:ital,wght@0,700;1,700&family=Rye&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070b;--bg2:#101017;--card:#16161f;--line:#24242f;--txt:#f5f5f7;--mut:#9d9daf;--acc:#ff3d5a;--acc2:#ff8a3d;--ok:#3ddc97;--warn:#ffc53d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
.disp{font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:.02em;line-height:.95;font-weight:400}
.grad{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:1360px;margin:0 auto;padding:0 4vw}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:8px;font-weight:700;transition:.2s;white-space:nowrap;text-decoration:none}
.btn-p{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 10px 30px -12px var(--acc)}
.btn-p:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-w{background:#fff;color:#000}.btn-w:hover{background:#ddd}
.btn-g{background:rgba(120,120,140,.35);backdrop-filter:blur(10px)}.btn-g:hover{background:rgba(120,120,140,.5)}
.btn-o{border:1px solid var(--line)}.btn-o:hover{border-color:var(--mut)}
.btn-sm{padding:8px 16px;font-size:14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.ico{width:44px;height:44px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35)}
.ico:hover{border-color:#fff}
/* Header */
header{position:fixed;top:0;left:0;right:0;z-index:50;transition:background .4s;background:linear-gradient(rgba(0,0,0,.75),transparent)}
header.solid{background:rgba(7,7,11,.94);backdrop-filter:blur(14px)}
.hbar{display:flex;align-items:center;gap:28px;height:68px}
.logo{font-family:"Bebas Neue",Impact,sans-serif;font-size:32px;letter-spacing:.05em;text-decoration:none;line-height:1}
.logo b{color:var(--acc);font-weight:400}
.nav{display:flex;gap:20px}
.nav a{white-space:nowrap;text-decoration:none;color:#c8c8d4;font-weight:500;font-size:14px;transition:.2s}
.nav a.on{color:#fff;font-weight:700}.nav a:hover{color:#fff}
.hright{margin-left:auto;display:flex;align-items:center;gap:12px}
.search{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:7px 12px}
.search input{background:none;border:0;outline:0;width:170px;font-size:14px}
.avatar{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc2));text-decoration:none}
.tabbar{display:none}
@media(max-width:860px){
 .nav,.hide-m{display:none!important}
 .hbar{gap:12px;height:60px}.logo{font-size:27px}.search input{width:100px}
 .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(7,7,11,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
 .tabbar a{flex:1;text-align:center;text-decoration:none;color:var(--mut);font-size:10.5px;font-weight:600}
 .tabbar a svg{display:block;margin:0 auto 2px;width:22px;height:22px}
 .tabbar a.on{color:#fff}
 main{padding-bottom:76px}
}
/* Art */
.art{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:10% 9% 9%;text-align:center;container-type:inline-size}
.art>svg{position:absolute;inset:0;width:100%;height:100%}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.85));pointer-events:none}
.art .by,.art .tt,.art .yr{position:relative;z-index:2}
.art .by{font-size:max(7px,5.5cqw);letter-spacing:.25em;text-transform:uppercase;font-weight:600;opacity:.85;text-shadow:0 1px 6px #000}
.art .tt{margin-top:auto;font-size:13cqw;line-height:.98;text-shadow:0 2px 14px rgba(0,0,0,.8);text-wrap:balance}
.art .yr{font-size:max(7px,5cqw);letter-spacing:.3em;opacity:.7;margin-top:6px}
.art .real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#000}
.art::after{z-index:1}
.slide video.hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s}
.slide video.hv.on{opacity:1}
.lang{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 8px;font-size:13px}
.ch.sch{width:300px;height:185px;text-align:left;padding:12px 14px}
.ch.sch b{font-size:17px}
.chgrid .ch.sch{width:auto}
.sch>svg,.sch>img,.sch>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sch::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,rgba(0,0,0,.92))}
.sch>*:not(svg):not(img):not(video){z-index:2}
.sch .now{position:relative;font-size:12px;color:#eee;margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.sch .pg{position:relative;height:3px;background:rgba(255,255,255,.25);margin-top:6px;border-radius:2px}.sch .pg i{display:block;height:100%;background:var(--acc);border-radius:2px}
.chgrid .sch{width:auto}
.epg{display:flex;gap:18px;font-size:13px;color:#ccc;flex-wrap:wrap}.epg b{color:#fff}
[dir=rtl] .hc{left:auto;right:4vw}[dir=rtl] .dots{right:auto;left:4vw}
.badge{position:absolute;z-index:3;font-size:9px;font-weight:800;letter-spacing:.1em;padding:3px 6px;border-radius:3px}
.b-new{top:0;left:50%;transform:translateX(-50%);background:var(--acc);border-radius:0 0 4px 4px}
.b-serie{top:8px;left:8px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3)}
.b-top{top:0;right:8px;background:var(--acc);padding:4px 5px 6px;line-height:1.05;text-align:center;border-radius:0 0 3px 3px}
.card{position:relative;flex:0 0 auto;width:calc((100vw - 8vw - 5*10px)/6.3);min-width:128px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;scroll-snap-align:start;background:var(--card)}
.card:hover{transform:scale(1.07);box-shadow:0 18px 50px -12px #000;z-index:4}
.card .hov{position:absolute;inset:0;z-index:5;background:linear-gradient(transparent 35%,rgba(0,0,0,.95));opacity:0;transition:.25s;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;text-align:left}
.card:hover .hov{opacity:1}
.hov .hb{display:flex;gap:6px;margin-bottom:8px}
.hov .hb span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.6);font-size:13px}
.hov .hb span:first-child{background:#fff;color:#000;border-color:#fff}
.hov small{font-size:11px;color:#ddd}
.hov .m{color:var(--ok);font-weight:700;font-size:11px}
.card .bar{position:absolute;z-index:6;left:8px;right:8px;bottom:6px;height:3px;background:rgba(255,255,255,.3)}
.card .bar b{display:block;height:100%;background:var(--acc)}
@media(max-width:860px){.card{width:31vw}.card .hov{display:none}}
.row{margin:2.2vw 0;position:relative}
.row h3{font-size:clamp(17px,1.5vw,22px);font-weight:700;margin:0 4vw 10px;display:flex;align-items:baseline;gap:12px}
.row h3 a{font-size:13px;color:var(--acc);text-decoration:none;font-weight:600;opacity:0;transition:.3s}
.row:hover h3 a{opacity:1}
.scroller{display:flex;gap:10px;overflow-x:auto;padding:14px 4vw 22px;scroll-snap-type:x mandatory;scroll-padding:0 4vw;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:44px;bottom:30px;width:4vw;z-index:7;background:rgba(0,0,0,.55);font-size:34px;opacity:0;transition:.2s}
.row:hover .arrow{opacity:1}
.arrow.l{left:0}.arrow.r{right:0}
@media(max-width:860px){.arrow{display:none}}
/* Top 10 */
.topc{display:flex;align-items:flex-end;flex:0 0 auto;scroll-snap-align:start}
.topc .num{font-family:"Bebas Neue",Impact;font-size:clamp(120px,15vw,220px);line-height:.72;color:var(--bg);-webkit-text-stroke:3px #5a5a6e;margin-right:-1.2vw;letter-spacing:-.05em}
.topc .card{width:calc((100vw - 8vw)/8);min-width:110px}
@media(max-width:860px){.topc .card{width:26vw}}
/* Hero */
.hero{position:relative;height:min(92vh,56vw + 120px);min-height:560px;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .bg{position:absolute;inset:0}
.slide .bg>svg{width:100%;height:100%}
.slide.on .ly0{animation:kb 18s ease-out forwards;transform-origin:60% 40%}
.slide.on .ly1{animation:dr1 18s ease-out forwards}
.slide.on .ly2{animation:dr2 18s ease-out forwards}
@keyframes kb{from{transform:scale(1.18)}to{transform:scale(1)}}
@keyframes dr1{from{transform:translateX(-3%) scale(1.06)}to{transform:translateX(1%) scale(1)}}
@keyframes dr2{from{transform:translateX(4%) scale(1.1)}to{transform:translateX(-1%) scale(1.02)}}
.slide canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .shade{position:absolute;inset:0;background:linear-gradient(77deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 45%,transparent 70%),linear-gradient(0deg,var(--bg) 0%,transparent 28%)}
.hc{position:absolute;left:4vw;bottom:22%;max-width:min(620px,88vw);z-index:3}
.slide.on .hc>*{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.slide.on .hc>*:nth-child(2){animation-delay:.12s}.slide.on .hc>*:nth-child(3){animation-delay:.24s}.slide.on .hc>*:nth-child(4){animation-delay:.36s}.slide.on .hc>*:nth-child(5){animation-delay:.48s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.hc .kick{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#ddd}
.hc .kick b{color:var(--acc)}
.hc h1{font-size:clamp(46px,7vw,104px);line-height:.92;margin:12px 0 14px;text-shadow:0 4px 30px rgba(0,0,0,.6);text-wrap:balance}
.hc .tag{font-size:clamp(16px,1.6vw,21px);font-weight:600;margin-bottom:8px}
.hc p.d{color:#d8d8e2;font-size:clamp(14px,1.15vw,17px);max-width:540px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:#c8c8d4;font-size:14px;margin:10px 0}
.meta .age{border:1px solid #aaa;padding:0 6px;border-radius:3px;font-size:12px}
.meta .lic{color:var(--ok);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.dots{position:absolute;right:4vw;bottom:24%;z-index:4;display:flex;gap:6px}
.dots button{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;position:relative}
.dots button i{position:absolute;inset:0;width:0;background:#fff}
.dots button.on i{animation:fill 9s linear forwards}
@keyframes fill{to{width:100%}}
.trailer-tag{position:absolute;right:4vw;top:90px;z-index:4;font-size:11px;font-weight:700;letter-spacing:.15em;padding:5px 10px;border-left:3px solid var(--acc);background:rgba(0,0,0,.45)}
.hero+.rows{margin-top:-9vw;position:relative;z-index:5}
@media(max-width:860px){.hero{height:82vh;min-height:520px}.hc{bottom:16%}.dots{bottom:9%;left:4vw;right:auto}.hero+.rows{margin-top:-60px}.trailer-tag{top:72px}}
/* Promo banner */
.promo{margin:10px 4vw 0;border-radius:14px;padding:22px 26px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:linear-gradient(110deg,rgba(255,61,90,.22),rgba(255,138,61,.12) 60%,rgba(255,255,255,.03));border:1px solid rgba(255,61,90,.35)}
.promo h4{font-size:20px}.promo p{color:#cfcfda;font-size:14px}
.promo .btn{margin-left:auto}
/* Channels */
.ch{flex:0 0 auto;width:200px;height:112px;border-radius:8px;position:relative;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;scroll-snap-align:start;transition:transform .25s}
.ch:hover{transform:scale(1.05)}
.ch b{font-size:20px;font-weight:800;position:relative;letter-spacing:-.01em}
.ch small{position:relative;font-size:11px;opacity:.85}
.ch .live{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.1em;background:#e8173d;padding:2px 6px;border-radius:3px;display:flex;align-items:center;gap:4px}
.ch .live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2}}
.ch .ext{position:absolute;top:10px;right:10px;font-size:14px;opacity:.7}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.chgrid .ch{width:auto}
/* Pages */
.page{padding-top:100px;padding-bottom:40px}
.page h1{font-size:clamp(44px,6vw,76px);margin-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:18px 0 24px;scrollbar-width:none}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap;color:#c8c8d4}
.chip.on{background:#fff;color:#000;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 10px}
.grid .card{width:auto;min-width:0}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cat{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;text-align:left;transition:transform .25s}
.cat:hover{transform:scale(1.04)}
.cat>svg{position:absolute;inset:0;width:100%;height:100%}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.75),transparent)}
.cat span{position:absolute;left:16px;bottom:14px;z-index:2;font-family:"Bebas Neue";font-size:34px;line-height:1}
.cat small{position:absolute;left:16px;top:12px;z-index:2;font-size:12px;color:#ddd}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.empty .big{font-size:48px;margin-bottom:10px}
/* Landing extras */
.sec{padding:80px 0;border-top:8px solid #111118}
.sec h2{font-size:clamp(40px,5.5vw,64px);text-align:center;margin-bottom:10px}
.sec .sub{text-align:center;color:var(--mut);margin-bottom:40px;font-size:17px}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.feat{background:linear-gradient(160deg,#1a1a26,#0f0f16);border:1px solid var(--line);border-radius:16px;padding:24px}
.feat .ic{font-size:30px;margin-bottom:12px}
.feat h4{font-size:17px;margin-bottom:6px}.feat p{color:var(--mut);font-size:14px}
.plan{max-width:440px;margin:0 auto;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,linear-gradient(135deg,var(--acc),var(--acc2)) border-box;border:2px solid transparent;border-radius:22px;padding:32px;text-align:center}
.plan .trial{display:inline-block;background:var(--acc);font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;margin-bottom:14px}
.plan-opt{position:relative;border:2px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px;text-align:center;font-size:14px}
.plan-opt.on{border-color:var(--acc);background:rgba(255,61,90,.1)}
.plan-opt em{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--ok);color:#000;font-style:normal;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap}
.paywall{position:absolute;inset:0;z-index:8;background:radial-gradient(circle at 50% 40%,rgba(30,8,14,.88),rgba(0,0,0,.96));display:grid;place-items:center;padding:20px;animation:fade .4s}
.paywall .box{max-width:460px;text-align:center}
.pv-tag{font-size:11px;font-weight:800;letter-spacing:.08em;background:var(--ok);color:#000;padding:3px 8px;border-radius:4px;margin-left:8px}
.plan .price{font-family:"Bebas Neue";font-size:84px;line-height:1}
.plan .price small{font-family:Inter;font-size:16px;color:var(--mut)}
.plan ul{list-style:none;text-align:left;margin:22px 0;display:grid;gap:10px}
.plan li{display:flex;gap:10px}.plan li::before{content:"✓";color:var(--ok);font-weight:800}
.faq{max-width:820px;margin:0 auto;display:grid;gap:8px}
.faq details{background:#1c1c26;padding:20px 24px}
.faq summary{cursor:pointer;font-weight:600;font-size:18px;list-style:none;display:flex;justify-content:space-between}
.faq summary::after{content:"+";font-size:28px;line-height:.8}
.faq details[open] summary::after{content:"×"}
.faq p{color:#cfcfda;margin-top:12px}
footer{border-top:1px solid var(--line);padding:40px 0 110px;color:var(--mut);font-size:13px;margin-top:40px}
footer .cols{display:flex;flex-wrap:wrap;gap:30px;justify-content:space-between}
footer a,footer button{color:var(--mut);text-decoration:none;font-size:13px;text-align:left}
footer a:hover,footer button:hover{color:#fff;text-decoration:underline}
.demo-tag{display:inline-block;background:rgba(255,197,61,.12);color:var(--warn);border:1px solid rgba(255,197,61,.3);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
/* Account */
.acc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:26px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:24px}
.panel h3{font-size:17px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}
.status{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.st-active,.st-trialing{background:rgba(61,220,151,.14);color:var(--ok)}
.st-canceled,.st-past_due{background:rgba(255,197,61,.14);color:var(--warn)}
.st-none,.st-expired{background:rgba(255,255,255,.08);color:var(--mut)}
.toggle{position:relative;width:44px;height:26px;border-radius:99px;background:var(--line);transition:.2s;flex:0 0 auto}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--acc)}.toggle.on::after{left:21px}
.inv{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.dev{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.dev:last-child{border:0}.dev .e{font-size:22px;width:30px;text-align:center}
/* Modal */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:32px 12px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{position:relative;width:100%;max-width:880px;background:#14141c;border-radius:12px;overflow:hidden;animation:up .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 80px #000}
.modal.sm{max-width:450px;padding:32px}
@keyframes up{from{transform:translateY(30px) scale(.97);opacity:0}}
.x{position:absolute;top:14px;right:14px;z-index:9;width:38px;height:38px;border-radius:50%;background:#14141c;font-size:22px;display:grid;place-items:center}
.m-hero{position:relative;aspect-ratio:16/8.5;overflow:hidden}
.m-hero>svg{position:absolute;inset:0;width:100%;height:100%}

.m-hero h2{font-size:clamp(38px,6vw,68px);line-height:.92;margin-bottom:16px;text-shadow:0 2px 20px #000}
.m-body{padding:4px 5% 30px;display:grid;grid-template-columns:2fr 1fr;gap:28px}
.m-body p.desc{color:#e2e2ea;font-size:15px}

.ep{display:flex;gap:16px;align-items:center;padding:16px;border-radius:6px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.ep:hover{background:#22222d}
.ep .n{font-size:24px;color:#aaa;width:28px;text-align:center}
.ep .th{width:130px;aspect-ratio:16/9;border-radius:4px;overflow:hidden;flex:0 0 auto;position:relative}
.ep .th svg{width:100%;height:100%}
.ep .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.3)}

.tabs{display:flex;gap:4px;background:rgba(255,255,255,.06);border-radius:999px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;padding:9px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mut)}

.field{background:#22222d;border:1px solid #33333f;border-radius:6px;padding:14px 16px;outline:0;width:100%}
.field:focus{border-color:#fff}
.err{color:var(--acc);font-size:14px;min-height:20px}
.muted{color:var(--mut);font-size:14px}
.link{color:var(--txt);text-decoration:underline;font-size:14px}
/* Player */
.player{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column}
.player video,.player iframe{flex:1;width:100%;min-height:0;background:#000;border:0}
.ptop{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:14px;padding:16px;background:linear-gradient(rgba(0,0,0,.85),transparent);transition:opacity .4s}
.ptop h4{font-size:16px}.ptop small{color:#bbb}
.sim{flex:1;position:relative;overflow:hidden}
.sim>svg{position:absolute;inset:0;width:100%;height:100%}
.sim canvas{position:absolute;inset:0;width:100%;height:100%}
.sim .ly0{animation:kb 30s linear infinite alternate}.sim .ly2{animation:dr2 30s linear infinite alternate}
.sim .note{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;text-align:center;max-width:440px;width:88%;padding:20px;background:rgba(0,0,0,.6);border-radius:14px;backdrop-filter:blur(6px)}
.pctl{position:relative;z-index:3;padding:14px 18px calc(18px + env(safe-area-inset-bottom));background:#000}
.pctl input[type=range]{width:100%;accent-color:var(--acc)}
.pbtns{display:flex;align-items:center;gap:14px;margin-top:6px;font-size:14px}

.pbtns button:hover{background:rgba(255,255,255,.12)}
.nextup{position:absolute;right:20px;bottom:110px;z-index:5;background:rgba(20,20,28,.95);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:center;animation:up .3s}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:300;background:#fff;color:#000;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.loader{min-height:100vh;display:grid;place-items:center}
.intro{font-family:"Bebas Neue";font-size:min(22vw,180px);letter-spacing:.05em;animation:introz 1.6s cubic-bezier(.6,0,.2,1) forwards}
.intro b{color:var(--acc);font-weight:400}
@keyframes introz{0%{opacity:0;transform:scale(.6);filter:blur(10px)}40%{opacity:1;transform:scale(1);filter:blur(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.6);filter:blur(6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app" style="min-height:100vh"><div class="loader"><div class="intro">STREAM<b>LY</b></div></div></main>
<nav class="tabbar" id="tabbar"></nav>
<div id="toast"></div>
<div id="testbar" style="display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:70;background:#ffc53d;color:#000;font:700 11px Inter,sans-serif;padding:3px 10px;border-radius:0 0 6px 6px">VERSION TEST · accès complet</div>
<script src="catalog.js"></script>
<script src="art.js"></script>
<script src="i18n.js"></script>
<script>
/* =========================================================
   CONFIGURATION — à remplir pour passer en production.
   Laissez SUPABASE_URL vide pour rester en MODE DÉMO.
   ========================================================= */
const CONFIG = {
  SITE_NAME: "STREAMLY",
  TEST_MODE: true,                // true = accès complet sans compte ni paiement (version de test). Mettre false pour lancer.
  PRICE: "3,99 €",
  PRICE_YEAR: "39,99 €",          // formule annuelle (2 mois offerts)
  PREVIEW_SECONDS: 180,           // minutes gratuites avant abonnement
  STRIPE_PAYMENT_LINK_YEAR: "",   // lien Stripe de la formule annuelle
  TRIAL_DAYS: 7,
  SUPABASE_URL: "",
  SUPABASE_ANON_KEY: "",
  STRIPE_PAYMENT_LINK: "",
  STRIPE_PORTAL_LINK: "",
  KODI_ZIP: "kodi/plugin.video.streamly.zip"
};
const DATA = window.STREAMLY_DATA;
const CATALOG = DATA.titles;
const CHANNELS = DATA.channels;
const byId = id => CATALOG.find(t => t.id === id);
const PREVIEW = /claude|anthropic/i.test(location.hostname);

/* ========================= Utilitaires ========================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = t => new Date(t).toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});
const fmtTime = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const eps = t => t.type==="serie" ? t.seasons.flat().length : 0;
const dur = t => t.type === "film" ? (t.min >= 60 ? `${Math.floor(t.min/60)} h ${String(t.min%60).padStart(2,"0")}` : `${t.min} min`) : `${t.seasons.length} saison · ${eps(t)} épisodes`;
const epInfo = (t, ep) => { const [s,e] = ep.slice(1).split("e").map(Number); return {s, e, ...t.seasons[s-1][e-1]}; };
const match = t => 86 + (t.id.length * 7 + t.year) % 13;
function toast(msg){ const el=$("#toast"); el.textContent=tr(msg); el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),2800); }
function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=ko; document.head.appendChild(s); }); }
async function sha(txt){ try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ return btoa(unescape(encodeURIComponent(txt))); } }
const DAY = 864e5;
const mem = {};
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v!=null ? JSON.parse(v) : (k in mem ? mem[k] : d); }catch(e){ return k in mem ? mem[k] : d; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ========================= Langues ========================= */
const I18N = window.STREAMLY_I18N;
let LANG = store.get("sx_lang", null) || (navigator.language || "fr").slice(0,2).toLowerCase();
if(!I18N.LANGS[LANG]) LANG = "en";
document.documentElement.lang = LANG; if(LANG==="ar") document.documentElement.dir = "rtl";
const DICT = {}; I18N.RAW.split("\n").forEach(l => { const [fr,en,es,de,ar] = l.split("|"); if(fr) DICT[fr.trim()] = {en,es,de,ar}; });
function tr1(k){
  const e = DICT[k]; if(e && e[LANG]) return e[LANG];
  for(const [re,m] of I18N.PATTERNS){ const r = k.match(re); if(r && m[LANG]) return m[LANG].replace(/\$(\d)/g, (_,i) => r[i]); }
  return null;
}
function tr(s){
  if(LANG==="fr" || !s) return s; const k = s.trim(); if(!k) return s;
  let v = tr1(k);
  if(v==null && k.includes(" · ")) { const parts = k.split(" · ").map(p => tr1(p) ?? p); v = parts.join(" · "); if(v===k) v = null; }
  return v==null ? s : s.replace(k, v);
}
function translateTree(root){
  if(LANG==="fr") return;
  if(root.nodeType===3){ const v=tr(root.nodeValue); if(v!==root.nodeValue) root.nodeValue=v; return; }
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while((n = w.nextNode())){ const v = tr(n.nodeValue); if(v!==n.nodeValue) n.nodeValue = v; }
  if(root.querySelectorAll) [root, ...root.querySelectorAll("[placeholder],[title],[aria-label]")].forEach(el => { for(const a of ["placeholder","title","aria-label"]) if(el.hasAttribute && el.hasAttribute(a)) el.setAttribute(a, tr(el.getAttribute(a))); });
}
if(LANG!=="fr"){
  CATALOG.forEach(t => { const l = t.i18n && (t.i18n[LANG] || t.i18n.en); if(l) Object.assign(t, l); });
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(translateTree))).observe(document.documentElement, {childList:true, subtree:true});
}

/* ========================= Données (démo / Supabase) ========================= */
const DemoAPI = {
  mode: "demo",
  async init(){},
  async session(){
    const email = store.get("sx_session", null); if(!email) return null;
    const u = store.get("sx_users", {})[email]; if(!u) return null;
    return {id:email, email, name:u.name, created:u.created};
  },
  async signUp(name,email,pass){
    const users = store.get("sx_users", {});
    if(users[email]) throw new Error("Un compte existe déjà avec cet e-mail.");
    users[email] = {name, hash:await sha(pass), created:Date.now()};
    store.set("sx_users", users); store.set("sx_session", email);
    return this.session();
  },
  async signIn(email,pass){
    const u = store.get("sx_users", {})[email];
    if(!u || u.hash !== await sha(pass)) throw new Error("E-mail ou mot de passe incorrect.");
    store.set("sx_session", email); return this.session();
  },
  async signOut(){ store.set("sx_session", null); },
  async resetPassword(){ /* simulé */ },
  _d(uid){ return store.get("sx_data_"+uid, {favs:[], progress:{}, sub:{status:"none", periodEnd:null}, invoices:[]}); },
  _s(uid,d){ store.set("sx_data_"+uid, d); },
  async getUserData(uid){
    const d = this._d(uid);
    // Simulation du renouvellement / de l'expiration
    if(d.sub.status==="trialing" && d.sub.periodEnd < Date.now()){ d.sub.status="active"; d.invoices.unshift({date:d.sub.periodEnd, amount:CONFIG.PRICE, status:"Payée"}); d.sub.periodEnd += 30*DAY; this._s(uid,d); }
    if(d.sub.status==="active" && d.sub.periodEnd && d.sub.periodEnd < Date.now()){ d.sub.periodEnd += 30*DAY; d.invoices.unshift({date:Date.now(), amount:CONFIG.PRICE, status:"Payée"}); this._s(uid,d); }
    if(d.sub.status==="canceled" && d.sub.periodEnd < Date.now()){ d.sub.status="expired"; this._s(uid,d); }
    return d;
  },
  async toggleFav(uid,id,on){ const d=this._d(uid); d.favs = d.favs.filter(x=>x!==id); if(on) d.favs.unshift(id); this._s(uid,d); },
  async saveProgress(uid,id,p){ const d=this._d(uid); if(p) d.progress[id]=p; else delete d.progress[id]; this._s(uid,d); },
  async clearProgress(uid){ const d=this._d(uid); d.progress={}; this._s(uid,d); },
  async updateName(uid,name){ const users=store.get("sx_users",{}); if(users[uid]){ users[uid].name=name; store.set("sx_users",users); } },
  async subscribe(){ openDemoCheckout(); },
  async activate(uid){ const d=this._d(uid); d.sub={status:"trialing", plan:state.plan, periodEnd:Date.now()+CONFIG.TRIAL_DAYS*DAY}; this._s(uid,d); },
  async cancel(uid){ const d=this._d(uid); d.sub.status="canceled"; this._s(uid,d); },
  async resume(uid){ const d=this._d(uid); d.sub.status="active"; this._s(uid,d); },
  async deleteAccount(uid){ const users=store.get("sx_users",{}); delete users[uid]; store.set("sx_users",users); store.set("sx_data_"+uid,null); store.set("sx_session",null); },
  async getMediaUrl(){ return null; }
};

const SupabaseAPI = {
  mode: "supabase", c: null,
  async init(){
    await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
    this.c = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    this.c.auth.onAuthStateChange((ev)=>{
      if(ev==="SIGNED_OUT" && state.user){ state.user=null; route(); }
      if(ev==="PASSWORD_RECOVERY") setTimeout(openNewPassword, 300);
    });
  },
  async session(){
    const {data} = await this.c.auth.getSession(); const u = data.session?.user; if(!u) return null;
    return {id:u.id, email:u.email, name:u.user_metadata?.display_name || u.email.split("@")[0], created:u.created_at};
  },
  async signUp(name,email,pass){
    const {data,error} = await this.c.auth.signUp({email, password:pass, options:{data:{display_name:name}, emailRedirectTo:location.origin+location.pathname}});
    if(error) throw new Error(error.message);
    if(!data.session) throw new Error("Compte créé ! Confirmez votre adresse via l'e-mail reçu, puis connectez-vous.");
    return this.session();
  },
  async signIn(email,pass){ const {error} = await this.c.auth.signInWithPassword({email, password:pass}); if(error) throw new Error("E-mail ou mot de passe incorrect."); return this.session(); },
  async signOut(){ await this.c.auth.signOut(); },
  async resetPassword(email){ const {error} = await this.c.auth.resetPasswordForEmail(email, {redirectTo:location.origin+location.pathname}); if(error) throw new Error(error.message); },
  async getUserData(uid){
    const [p,s,f,w] = await Promise.all([
      this.c.from("profiles").select("display_name").eq("id",uid).maybeSingle(),
      this.c.from("subscriptions").select("*").eq("user_id",uid).maybeSingle(),
      this.c.from("favorites").select("title_id,created_at").eq("user_id",uid).order("created_at",{ascending:false}),
      this.c.from("watch_progress").select("*").eq("user_id",uid)
    ]);
    const progress = {};
    (w.data||[]).forEach(r => progress[r.title_id] = {ep:r.episode, pos:r.position, dur:r.duration, at:Date.parse(r.updated_at)});
    const sub = s.data || {};
    return { name:p.data?.display_name, favs:(f.data||[]).map(r=>r.title_id), progress,
      sub:{status:sub.status||"none", periodEnd:sub.current_period_end ? Date.parse(sub.current_period_end) : null}, invoices:null };
  },
  async toggleFav(uid,id,on){ on ? await this.c.from("favorites").insert({user_id:uid, title_id:id}) : await this.c.from("favorites").delete().eq("user_id",uid).eq("title_id",id); },
  async saveProgress(uid,id,p){
    if(!p) return this.c.from("watch_progress").delete().eq("user_id",uid).eq("title_id",id);
    await this.c.from("watch_progress").upsert({user_id:uid, title_id:id, episode:p.ep, position:Math.floor(p.pos), duration:Math.floor(p.dur), updated_at:new Date().toISOString()});
  },
  async clearProgress(uid){ await this.c.from("watch_progress").delete().eq("user_id",uid); },
  async updateName(uid,name){ await this.c.from("profiles").update({display_name:name}).eq("id",uid); await this.c.auth.updateUser({data:{display_name:name}}); },
  async subscribe(user){
    const link = state.plan==="year" && CONFIG.STRIPE_PAYMENT_LINK_YEAR ? CONFIG.STRIPE_PAYMENT_LINK_YEAR : CONFIG.STRIPE_PAYMENT_LINK;
    if(!link) throw new Error("Lien de paiement Stripe non configuré.");
    location.href = link + "?client_reference_id=" + encodeURIComponent(user.id) + "&prefilled_email=" + encodeURIComponent(user.email);
  },
  async cancel(){ this.portal(); }, async resume(){ this.portal(); },
  portal(){ if(!CONFIG.STRIPE_PORTAL_LINK) throw new Error("Portail client Stripe non configuré."); location.href = CONFIG.STRIPE_PORTAL_LINK; },
  async deleteAccount(){ throw new Error("Pour supprimer votre compte, contactez le support."); },
  async getMediaUrl(id,ep){
    const {data} = await this.c.from("title_media").select("video_url").eq("title_id",id).eq("episode",ep||"film").maybeSingle();
    return data?.video_url || null;
  }
};



const API = CONFIG.SUPABASE_URL ? SupabaseAPI : DemoAPI;


/* ============================ État ============================ */
const state = { plan:"month", user:null, favs:new Set(), progress:{}, sub:{status:"none"}, invoices:[], genre:"Tous", q:"", prefs:store.get("sx_prefs",{autoplay:true}), heroIdx:0 };
function isSubscribed(){ if(CONFIG.TEST_MODE) return true; const s = state.sub; return s.status==="active" || s.status==="trialing" || (s.status==="canceled" && s.periodEnd > Date.now()); }

/* ========================= Visuels ========================= */
function poster(t){
  const f = ART.FONT[t.art] || "Bebas Neue";
  const sz = f==="Bebas Neue" ? 1.25 : f==="Orbitron" ? .78 : f==="Rye" || f==="Creepster" ? .95 : 1;
  const len = t.title.length; const k = len > 26 ? .72 : len > 16 ? .82 : len > 9 ? .95 : 1.2;
  return `<div class="art">${ART.sceneSVG(t,200,300)}${realPoster(t)}<span class="by">${esc(t.by)}</span><span class="tt" style="font-family:'${f}',Impact,serif;font-size:${(13*sz*k).toFixed(1)}cqw">${esc(t.title)}</span><span class="yr">${t.year}</span></div>`;
}
function posterSrc(t){ const s = t.type==="serie" ? t.seasons[0][0].src : t.src; return s; }
function realPoster(t){
  if(PREVIEW) return "";
  const s = posterSrc(t);
  if(s.archive) return `<img class="real" loading="lazy" alt="" src="https://archive.org/services/img/${encodeURIComponent(s.archive)}" onerror="this.remove()">`;
  if(s.mp4) return `<video class="real" muted playsinline preload="metadata" src="${s.mp4}#t=${t.posterAt||40}" onerror="this.remove()"></video>`;
  return "";
}
const wide = (t, layered) => ART.sceneSVG(t, 1600, 900, layered);
function card(t){
  const p = state.progress[t.id]; const pct = p ? Math.min(100, p.pos/p.dur*100) : 0;
  const rank = t.top && t.type==="film" ? t.top : 0;
  return `<button class="card" data-open="${t.id}" aria-label="${esc(t.title)}">${poster(t)}
    ${t.isNew?'<span class="badge b-new">NOUVEAU</span>':""}${t.type==="serie"?'<span class="badge b-serie">SÉRIE</span>':""}${rank && rank<=10 && !t.isNew?`<span class="badge b-top">TOP<br>${rank}</span>`:""}
    <span class="hov"><span class="hb"><span>▶</span><span>${state.favs.has(t.id)?"✓":"+"}</span></span><span class="m">${match(t)} % pour vous</span><small>${t.year} · ${dur(t)} · ${t.genres.slice(0,2).join(" · ")}</small></span>
    ${pct?`<i class="bar"><b style="width:${pct}%"></b></i>`:""}</button>`;
}
let rowId = 0;
function row(title, list, link){
  if(!list.length) return ""; const id = "r"+(rowId++);
  return `<section class="row"><h3>${title}${link?`<a href="${link}">Tout voir ›</a>`:""}</h3><button class="arrow l" data-scroll="${id}" data-dir="-1">‹</button><div class="scroller" id="${id}">${list.map(card).join("")}</div><button class="arrow r" data-scroll="${id}" data-dir="1">›</button></section>`;
}
function topRow(){
  const list = CATALOG.filter(t=>t.top && t.type==="film").sort((a,b)=>a.top-b.top).slice(0,10); const id = "r"+(rowId++);
  return `<section class="row"><h3>Top 10 des films aujourd'hui</h3><button class="arrow l" data-scroll="${id}" data-dir="-1">‹</button><div class="scroller" id="${id}">${list.map((t,i)=>`<div class="topc"><span class="num">${i+1}</span>${card(t)}</div>`).join("")}</div><button class="arrow r" data-scroll="${id}" data-dir="1">›</button></section>`;
}
function chTile(c){
  if(c.yt) return `<button class="ch" data-live="${esc(c.name)}" style="background:linear-gradient(135deg,${c.c},#0b0b12 140%);text-align:left"><span class="live">DIRECT</span><span class="ext">▶</span><b>${esc(c.name)}</b><small>Regarder ici, gratuitement</small></button>`;
  return `<a class="ch" href="${c.url}" target="_blank" rel="noopener" style="background:linear-gradient(135deg,${c.c},#0b0b12 140%)"><span class="${c.group==="Plateformes gratuites"?"":"live"}">${c.group==="Plateformes gratuites"?"":"DIRECT"}</span><span class="ext">↗</span><b>${esc(c.name)}</b><small>${esc(c.note || c.group)}</small></a>`;
}

// Vrais extraits des films dans le bandeau (muets, en boucle)
async function heroExcerpt(slide, t){
  if(PREVIEW || slide.dataset.vid) return; slide.dataset.vid = 1;
  try{
    const s = await resolveSource(t, t.type==="serie" ? "s1e1" : "film"); if(!s.url) return;
    const v = document.createElement("video"); v.className = "hv"; v.muted = true; v.playsInline = true; v.loop = true; v.preload = "auto";
    v.setAttribute("muted",""); v.setAttribute("playsinline","");
    v.onloadedmetadata = () => { v.currentTime = Math.min(v.duration * .3, 900); };
    v.onseeked = () => { v.play().then(() => v.classList.add("on")).catch(() => {}); v.onseeked = null; };
    v.onerror = () => v.remove();
    v.src = s.url; slide.querySelector(".bg").after(v);
  }catch(e){}
}
function startHero(i=state.heroIdx){
  const slides = document.querySelectorAll(".slide"); if(!slides.length) return;
  i = (i + slides.length) % slides.length; state.heroIdx = i;
  slides.forEach((s,k)=>{ s.classList.toggle("on", k===i); const v=s.querySelector("video.hv"); if(v){ if(k===i) v.play().catch(()=>{}); else v.pause(); } });
  heroExcerpt(slides[i], featuredList()[i]);
  document.querySelectorAll(".dots button").forEach((b,k)=>{ b.classList.remove("on"); void b.offsetWidth; b.classList.toggle("on", k===i); });
  const s = slides[i], cv = s.querySelector("canvas"), t = featuredList()[i];
  if(cv && !cv.dataset.run){ cv.dataset.run=1; ART.particles(cv, ART.FX[t.art], t.pal[2]); }
  clearTimeout(startHero.t); startHero.t = setTimeout(()=>{ if($("#hero") && !$("#ov") && !$("#player")) startHero(i+1); }, 9000);
}

const SCH = DATA.streamly_channels || [];
const EPOCH = Date.UTC(2026,0,1);
function chItems(c){
  if(c.series){ const t = byId(c.series); return t.seasons.flatMap((s,si) => s.map((e,ei) => ({t, ep:`s${si+1}e${ei+1}`, min:e.min, label:`${t.title} — ${e.t}`}))); }
  return CATALOG.filter(t => t.type==="film" && t.genres.some(g => c.genres.includes(g))).map(t => ({t, ep:"film", min:t.min, label:t.title}));
}
function nowOn(c, at=Date.now()){
  const items = chItems(c); const total = items.reduce((a,x) => a + x.min*60, 0);
  let pos = (((at - EPOCH)/1000) % total + total) % total;
  for(let k=0; k<items.length; k++){ const d = items[k].min*60; if(pos < d) return {item:items[k], offset:pos, dur:d, next:items[(k+1)%items.length]}; pos -= d; }
}
function schTile(c){

/* ========================= Lecteur ========================= */
const player = { t:null, ep:null, timer:null, sim:null, lastSave:0 };
async function resolveSource(t, ep){
  const override = await API.getMediaUrl(t.id, ep).catch(()=>null);
  if(override) return {url:override};
  const src = t.type==="serie" ? epInfo(t,ep).src : t.src;
  if(src.mp4) return {url:src.mp4};
  if(PREVIEW) return {sim:true};
  try{
    const r = await fetch(`https://archive.org/metadata/${encodeURIComponent(src.archive)}`); const j = await r.json();
    const vids = (j.files||[]).filter(f=>/\.mp4$/i.test(f.name));
    const pick = fmt => vids.filter(f=>(f.format||"").toLowerCase().includes(fmt)).sort((a,b)=>a.name.localeCompare(b.name));
    const pool = [pick("h.264"), pick("mpeg4"), vids].find(a=>a.length);
    const f = pool[Math.min(src.index||0, pool.length-1)];
    return {url:`https://archive.org/download/${encodeURIComponent(src.archive)}/${f.name.split("/").map(encodeURIComponent).join("/")}`};
  }catch(e){ return {iframe:`https://archive.org/embed/${encodeURIComponent(src.archive)}`}; }
}
async function play(id, ep){
  const t = byId(id); if(!t) return;
  const preview = !isSubscribed();
  const p = state.progress[id];
  ep = ep || (t.type==="serie" ? (p?.ep || "s1e1") : "film");
  const durSec = (t.type==="film" ? t.min : epInfo(t,ep).min) * 60;
  const start = p && p.ep===ep && p.pos < durSec-30 ? p.pos : 0;
  closeModal(); clearTimeout(startHero.t);
  player.t = t; player.ep = ep; player.preview = preview; player.pvStart = null;
  const label = t.type==="serie" ? `S${epInfo(t,ep).s}:É${epInfo(t,ep).e} « ${epInfo(t,ep).t} »` : `${t.year} · ${t.by}`;
  const el = document.createElement("div"); el.className="player"; el.id="player";
  el.innerHTML = `<div class="ptop"><button class="btn btn-g btn-sm" data-act="close-player">← Retour</button><div><h4>${esc(t.title)}${preview?`<span class="pv-tag">APERÇU GRATUIT · ${Math.round(CONFIG.PREVIEW_SECONDS/60)} MIN</span>`:""}</h4><small>${esc(label)}</small></div></div><div class="sim" id="pload"><div class="note">Chargement…</div></div>`;
  document.body.appendChild(el); document.body.style.overflow="hidden";
  const s = await resolveSource(t, ep);
  if(!$("#player")) return;
  $("#pload").remove();
  if(s.sim) return simulate(t, durSec, start);
  if(s.iframe){ el.insertAdjacentHTML("beforeend", `<iframe src="${s.iframe}" allow="autoplay; fullscreen" allowfullscreen></iframe>`); if(preview) player.pvTimer = setTimeout(paywall, CONFIG.PREVIEW_SECONDS*1000); return; }
  el.insertAdjacentHTML("beforeend", `<video id="vid" playsinline controls autoplay></video>`);
  const v = $("#vid");
  v.onerror = () => simulate(t, durSec, start);
  v.onloadedmetadata = () => { if(start && start < v.duration-10) v.currentTime = start; };
  v.ontimeupdate = () => { if(player.preview){ if(player.pvStart==null) player.pvStart = v.currentTime; if(v.currentTime - player.pvStart >= CONFIG.PREVIEW_SECONDS){ v.pause(); paywall(); } return; } if(Date.now()-player.lastSave > 5000){ player.lastSave=Date.now(); saveProgress(v.currentTime, v.duration || durSec); } };
  v.onended = () => { saveProgress(v.duration, v.duration); nextEpisode(); };
  v.src = s.url;
}
function paywall(){
  const pl = $("#player"); if(!pl || pl.querySelector(".paywall")) return;
  clearInterval(player.timer); if(player.sim) player.sim.playing = false;
  pl.querySelectorAll("iframe").forEach(f => f.remove());

    <button class="btn btn-p" style="width:100%;padding:16px;font-size:17px" data-act="pw-go">Démarrer mes ${CONFIG.TRIAL_DAYS} jours offerts</button>
    <p class="muted" style="margin-top:10px">Puis ${CONFIG.PRICE}/mois ou ${CONFIG.PRICE_YEAR}/an. Sans engagement.</p>

function simulate(t, durSec, start){
  const v=$("#vid"); if(v) v.remove();
  player.sim = {pos:start, dur:durSec, playing:true};
  const box = document.createElement("div"); box.className="sim";
  box.innerHTML = `${wide(t,true)}<canvas></canvas><div class="note"><b>Aperçu de lecture</b><p class="muted" style="margin-top:6px">Les vidéos ne peuvent pas se charger dans cet aperçu. Une fois le site en ligne sur GitHub, le film se lance ici pour de vrai. La progression est déjà enregistrée.</p></div>`;
  const ctl = document.createElement("div"); ctl.className="pctl";
  ctl.innerHTML = `<input type="range" id="seek" min="0" max="${durSec}" value="${start}"><div class="pbtns"><button data-act="pp" id="ppBtn">⏸</button><button data-act="back10">↺</button><button data-act="fwd10">↻</button><span id="ptime">${fmtTime(start)} / ${fmtTime(durSec)}</span><span style="margin-left:auto" class="muted">avance ×60 (démo)</span></div>`;
  const pl=$("#player"); pl.appendChild(box); pl.appendChild(ctl);
  ART.particles(box.querySelector("canvas"), ART.FX[t.art], t.pal[2]);
  $("#seek").oninput = e => { player.sim.pos = +e.target.value; updSim(); };
  if(player.preview) player.pvTimer = setTimeout(paywall, 6000);
  player.timer = setInterval(() => { if(!player.sim?.playing) return; player.sim.pos = Math.min(player.sim.dur, player.sim.pos + 60); updSim(); if(player.sim.pos>=player.sim.dur){ clearInterval(player.timer); nextEpisode(); } }, 1000);
}
function updSim(){ const s=player.sim; if(!s) return; const sk=$("#seek"); if(sk) sk.value=s.pos; const tm=$("#ptime"); if(tm) tm.textContent=`${fmtTime(s.pos)} / ${fmtTime(s.dur)}`; saveProgress(s.pos, s.dur); }
function saveProgress(pos, d){
  if(!player.t || !d || isNaN(d) || !state.user || player.preview) return;
  const id = player.t.id; let p = {ep:player.ep, pos, dur:d, at:Date.now()};
  if(pos > d-30 && player.t.type==="film") p = null;
  if(p) state.progress[id] = p; else delete state.progress[id];
  API.saveProgress(state.user.id, id, p).catch(()=>{});
}
function nextEpisode(){
  const t = player.t; if(t.type!=="serie" || !state.prefs.autoplay) return closePlayer();
  let [s,e] = player.ep.slice(1).split("e").map(Number);
  if(e < t.seasons[s-1].length) e++; else if(s < t.seasons.length){ s++; e=1; } else { delete state.progress[t.id]; API.saveProgress(state.user.id,t.id,null); toast("Série terminée 🎉"); return closePlayer(); }
  toast(`Épisode suivant : ${epInfo(t,`s${s}e${e}`).t}`); closePlayer(true); play(t.id, `s${s}e${e}`);
}
function closePlayer(silent){
  const v=$("#vid"); if(v && v.duration) saveProgress(v.currentTime, v.duration);
  clearInterval(player.timer); clearInterval(player.epg); clearTimeout(player.pvTimer); player.sim=null; player.channel=null;
  const pl=$("#player"); if(pl) pl.remove(); document.body.style.overflow="";
  if(!silent) route(true);
}

/* ========================= Actions ========================= */
let installEvt = null; addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-open],[data-play],[data-fav],[data-close],[data-auth],[data-tab],[data-genre],[data-cat],[data-act],[data-hero],[data-scroll],[data-live],[data-sch],[data-plan]");
  if(!el) return;
  const d = el.dataset;
  if(d.close !== undefined) return closeModal();
  if(d.plan){ state.plan = d.plan; const pc = el.closest(".plan"); if(pc){ pc.outerHTML = planCard(); bindPlan(); } return; }
  if(d.scroll){ const sc=$("#"+d.scroll); return sc.scrollBy({left:sc.clientWidth*.85*d.dir, behavior:"smooth"}); }
  if(d.hero) return startHero(+d.hero);
  if(d.live) return openLive(d.live);
  if(d.sch) return openChannel(d.sch);
  if(d.auth) return openAuth(d.auth);
  if(d.tab) return openAuth(d.tab, $("#aEmail")?.value || "");
  if(d.open) return openTitle(d.open);
  if(d.play) return play(d.play, d.ep);
  if(d.cat){ state.genre = d.cat; location.hash = "tout"; return; }
  if(d.genre){ state.genre = d.genre; return renderGrid(d.type || null); }
  if(d.fav){
    if(!state.user){ closeModal(); return openAuth("signup"); }
    const on = !state.favs.has(d.fav); on ? state.favs.add(d.fav) : state.favs.delete(d.fav);
    el.textContent = on ? "✓" : "+"; toast(on ? "Ajouté à Ma liste" : "Retiré de Ma liste");
    API.toggleFav(state.user.id, d.fav, on).catch(()=>toast("Erreur de synchronisation"));
    return;
  }
  const uid = state.user?.id;
  try{
    switch(d.act){
      case "signup": return openAuth("signup");
      case "pw-go": closePlayer(true); route(true); if(!state.user) return openAuth("signup"); location.hash = "abonnement"; return;
      case "go-sub": location.hash = "abonnement"; return;
      case "credits": return openCredits();
      case "apps": return openApps();
      case "install": if(installEvt){ installEvt.prompt(); installEvt=null; } else openApps(); return;
      case "close-player": return closePlayer();
      case "pp": player.sim.playing = !player.sim.playing; $("#ppBtn").textContent = player.sim.playing ? "⏸" : "▶"; return;
      case "back10": player.sim.pos = Math.max(0, player.sim.pos-10); return updSim();
      case "fwd10": player.sim.pos = Math.min(player.sim.dur, player.sim.pos+10); return updSim();
      case "demo-pay": await API.activate(uid); await loadUserData(); closeModal(); toast("Essai activé ! Bon visionnage 🍿"); location.hash="accueil"; return route();
      case "cancel": return confirmBox("Résilier l'abonnement ?", `Vous garderez l'accès jusqu'au ${fmtDate(state.sub.periodEnd||Date.now())}.`, "Résilier", async()=>{ await API.cancel(uid); await loadUserData(); toast("Abonnement résilié"); route(); });
      case "resume": await API.resume(uid); await loadUserData(); toast("Abonnement réactivé"); return route();
      case "portal": return SupabaseAPI.portal();
      case "autoplay": state.prefs.autoplay = !state.prefs.autoplay; store.set("sx_prefs", state.prefs); el.classList.toggle("on", state.prefs.autoplay); return;
      case "clear": return confirmBox("Effacer l'historique ?", "La rangée « Reprendre » sera vidée.", "Effacer", async()=>{ await API.clearProgress(uid); state.progress={}; toast("Historique effacé"); route(); });
      case "reset": await API.resetPassword(state.user.email); return toast("Lien de réinitialisation envoyé" + (API.mode==="demo"?" (simulé)":""));
      case "forgot": { const em=$("#aEmail").value.trim(); if(!em) return $("#aErr").textContent="Saisissez d'abord votre e-mail."; await API.resetPassword(em); return $("#aErr").textContent="Si un compte existe, un lien vous a été envoyé."; }
      case "logout": await API.signOut(); state.user=null; state.favs=new Set(); state.progress={}; state.sub={status:"none"}; toast("Vous êtes déconnecté"); location.hash="accueil"; return route();
      case "delete": return confirmBox("Supprimer votre compte ?", "Profil, liste et historique seront effacés définitivement.", "Supprimer", async()=>{ await API.deleteAccount(uid); state.user=null; toast("Compte supprimé"); location.hash="accueil"; route(); });
    }
  }catch(err){ toast(err.message); }
});
function confirmBox(title, text, okLabel, fn){
  modal(`<div class="modal sm"><h2 style="font-size:20px;margin-bottom:8px">${title}</h2><p class="muted">${text}</p><div class="actions"><button class="btn btn-o btn-sm" data-close>Annuler</button><button class="btn btn-p btn-sm" id="okBtn">${okLabel}</button></div></div>`);
  $("#okBtn").onclick = async () => { closeModal(); try{ await fn(); }catch(e){ toast(e.message); } };
}

/* ========================= Routage ========================= */
function route(keepScroll){
  const h = location.hash.slice(1) || "accueil";
  state.q = "";
  if((h==="compte" || h==="ma-liste") && !state.user){ renderHeader(h); renderHome(); openAuth(h==="compte"?"login":"signup"); return; }
  if(h==="tarif" && state.user){ location.hash="abonnement"; return; }
  const views = {accueil:renderHome, films:()=>renderGrid("film"), series:()=>renderGrid("serie"), tout:()=>renderGrid(null), categories:renderCategories, tv:renderTV, "ma-liste":renderList, compte:renderAccount, abonnement:renderSubscribe};
  if(h==="tarif"){ renderHome(); renderHeader("accueil"); setTimeout(()=>$("#tarif")?.scrollIntoView({behavior:"smooth"}),50); return; }
  if(h==="films"||h==="series") state.genre = views[h] && state.lastView===h ? state.genre : "Tous";
  state.lastView = h;
  (views[h] || renderHome)();
  renderHeader(views[h] ? (h==="tout"?"categories":h) : "accueil");
  if(!keepScroll) scrollTo(0,0);
}
addEventListener("hashchange", () => { closeModal(); route(); });
async function loadUserData(){
  const d = await API.getUserData(state.user.id);
  if(d.name) state.user.name = d.name;
  state.favs = new Set(d.favs); state.progress = d.progress || {}; state.sub = d.sub; state.invoices = d.invoices;
}
async function boot(){
  try{
    if(!boot.done){ boot.done = true; await API.init(); }
    state.user = await API.session();
    if(state.user) await loadUserData();
  }catch(e){ console.error(e); toast("Connexion au serveur impossible — vérifiez la configuration"); }
  route();
}
setTimeout(boot, 1300);
if(CONFIG.TEST_MODE) document.getElementById("testbar").style.display="block";
try{ if("serviceWorker" in navigator && !PREVIEW && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
</script>
</body>
</html>
